name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CyclopsApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
      - name: Fix gradle.properties extension
        run: |
          cd CyclopsApp
          if [ -f gradle.properties.txt ]; then
            mv gradle.properties.txt gradle.properties
          fi
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cyclops-debug-apk
          path: CyclopsApp/app/build/outputs/apk/debug/*.apk
